name: DevOps CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start application
        run: |
          APP_NAME="CI Test App" APP_VERSION="test" python3 server.py &
          sleep 2

      - name: Test application
        run: curl -f http://127.0.0.1:8000

      - name: Build Docker image
        run: docker build -t devops-app:test .
